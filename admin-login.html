<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftBuy Admin - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            position: relative;
            overflow: hidden;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #333;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-input {
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .login-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e1e5e9;
        }

        .login-footer a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert.error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
        }

        .alert.success {
            background: #efe;
            border: 1px solid #cfc;
            color: #363;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .setup-notice {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .setup-notice h3 {
            margin-bottom: 8px;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>SwiftBuy Admin</h1>
            <p>Enter your credentials to access the dashboard</p>
        </div>

        <div id="setupNotice" class="setup-notice" style="display: none;">
            <h3>First Time Setup Required</h3>
            <p>No admin account found. Please register the first admin user.</p>
        </div>

        <div id="alert" class="alert"></div>

        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    class="form-input" 
                    placeholder="admin@swiftbuy.com" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    class="form-input" 
                    placeholder="Enter your password" 
                    required
                >
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                Sign In to Dashboard
            </button>
        </form>

        <div class="login-footer">
            <a href="#" id="setupLink" style="display: none;">Setup First Admin Account</a>
        </div>
    </div>

    <script>
        class AdminLogin {
            constructor() {
                this.API_BASE_URL = 'http://localhost:5000/api';
                this.loginForm = document.getElementById('loginForm');
                this.setupLink = document.getElementById('setupLink');
                this.setupNotice = document.getElementById('setupNotice');
                this.alert = document.getElementById('alert');
                this.loginBtn = document.getElementById('loginBtn');
                
                this.init();
            }

            init() {
                this.loginForm.addEventListener('submit', (e) => this.handleLogin(e));
                this.setupLink.addEventListener('click', (e) => this.handleSetup(e));
                
                // Check if setup is needed
                this.checkSetupStatus();
            }

            async checkSetupStatus() {
                try {
                    // Try to verify if any admin exists
                    const response = await fetch(`${this.API_BASE_URL}/auth/verify`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ token: 'check' })
                    });

                    if (response.status === 401) {
                        this.showSetupOptions();
                    }
                } catch (error) {
                    this.showSetupOptions();
                }
            }

            showSetupOptions() {
                this.setupNotice.style.display = 'block';
                this.setupLink.style.display = 'block';
            }

            async handleLogin(e) {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                if (!email || !password) {
                    this.showAlert('Please enter both email and password', 'error');
                    return;
                }

                this.setLoading(true);

                try {
                    const response = await fetch(`${this.API_BASE_URL}/auth/login`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        // Save token and redirect
                        localStorage.setItem('admin_auth_token', data.token);
                        this.showAlert('Login successful! Redirecting...', 'success');
                        
                        setTimeout(() => {
                            window.location.href = 'admin-dashboard.html';
                        }, 1000);
                    } else {
                        this.showAlert(data.error || 'Login failed', 'error');
                    }
                } catch (error) {
                    this.showAlert('Cannot connect to server. Please check if backend is running.', 'error');
                } finally {
                    this.setLoading(false);
                }
            }

            async handleSetup(e) {
                e.preventDefault();
                
                const email = prompt('Enter admin email:');
                const password = prompt('Enter admin password (min 6 characters):');
                const username = prompt('Enter admin username:');

                if (!email || !password || !username) {
                    alert('All fields are required');
                    return;
                }

                if (password.length < 6) {
                    alert('Password must be at least 6 characters');
                    return;
                }

                try {
                    const response = await fetch(`${this.API_BASE_URL}/auth/register`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email, password, username })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        alert('Admin account created successfully! You can now login.');
                        this.setupNotice.style.display = 'none';
                        this.setupLink.style.display = 'none';
                    } else {
                        alert(data.error || 'Setup failed');
                    }
                } catch (error) {
                    alert('Cannot connect to server. Please check if backend is running.');
                }
            }

            showAlert(message, type) {
                this.alert.textContent = message;
                this.alert.className = `alert ${type}`;
                this.alert.style.display = 'block';
                
                setTimeout(() => {
                    this.alert.style.display = 'none';
                }, 5000);
            }

            setLoading(loading) {
                if (loading) {
                    this.loginBtn.innerHTML = '<div class="loading"></div> Signing In...';
                    this.loginBtn.disabled = true;
                } else {
                    this.loginBtn.innerHTML = 'Sign In to Dashboard';
                    this.loginBtn.disabled = false;
                }
            }
        }

        // Initialize login system when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new AdminLogin();
        });
    </script>
</body>
</html>
