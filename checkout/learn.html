// While Loop

    var y = 1; // when to start

    }

    2.  WHEN T STOP: The logical condition to test whether the loop should continue.

    /*
    for (start; stop; step) {

    }

    }

     let factorial = 12;

      console.log(r + "-" + s);

     // function
      function reverseString(reverseMe) {
        let reversed = "";
        for (let f = reverseMe.length - 1; f >= 0; f--) {
          reversed += reverseMe[f];
        }
        return reversed;
      }   
      console.log(reverseString('feysal'));

      // Set one parameter to hold the value of the input string
      function reverseMyName(reverseMe) {
        // Declare a variable with an empty sting to store the reversed string
        let reversed = "";
        // Loop through the 'reveseMe' string from back to front
        for (let i = reverseMe.length - 1; i >= 0; i--) {
          // Add each character to the end of 'reversed'
          reversed += reverseMe[i];
        }
        // Return the completed string when the loop is complete return reversed;
        return reversed;
      }

      /*
      FUNCTIONS package up code  so you can easily use ( and reuse) a block of code.
      PARAMETERS are variables that used to store the data that's passed into a function for the function to use
      ARGUMENTS are teh actual data thata's passed into function when it is invoked

      */
     // x and y are parameters in this function declaration
function add(x, y) {
  // function body
  // Here, `sum` variable has a scope within the function. 
  // Such variables defined within a function are called Local variables
  // You can try giving it another name
  const sum = x + y;
  return sum; // return statement
}

// 1 and 2 are passed into the function as arguments, 
// and the result returned by the function is stored in a new variable `sum`
// Here, `sum` is another variable, different from the one used inside the function
const sum = add(1, 2);

function add(x, y) {
